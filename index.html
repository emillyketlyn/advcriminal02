<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocacia Criminal | Plantão 24h</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Advocacia Criminal</div>
    </header>

    <main>
        <section class="form-section">
            <h2>Fale com um Advogado</h2>
            <form id="contatoForm">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
                <input type="tel" id="telefone" placeholder="Seu Telefone / WhatsApp" required>
                <textarea id="mensagem" placeholder="Descreva brevemente o seu caso" rows="4" required></textarea>
                <button type="submit">Enviar Mensagem</button>
            </form>
            <p id="statusMensagem"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
